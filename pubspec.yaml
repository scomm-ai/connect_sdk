name: scommconnector
description: SComm Connector Flutter package (libdatachannel FFI)
version: 1.0.0
publish_to: none
repository: git@github.com:scomm-ai/connect_sdk.git

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter
  path: ^1.9.0
  protobuf: ^6.0.0
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^10.0.0
  fixnum: ^1.1.1
  grpc: ^5.1.0
  signals: ^7.1.0
  equatable: ^2.0.8
  ffi: ^2.1.4

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
      linux:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      windows:
        ffiPlugin: true
